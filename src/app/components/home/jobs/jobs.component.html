<section class="section jobs" id='jobs'>
  <div class="container">
    <div class="section-box">
      <div class="about-title mb-5">
        <h3 class="e-font section-title">
          <span class='code-font n-section-title'>02.</span> {{"Experience.Title" | translate}}
        </h3>
      </div>

      <div class="jobs-tabs">
        <ul ngbNav #nav="ngbNav" [(activeId)]="active" orientation="vertical" class="nav-tabs jobs-tabs">
          <li *ngFor='let job of "Experience.Jobs" | translate; let i = index' [ngbNavItem]="i">
            
            <a ngbNavLink>{{job.Tab}}</a>

            <ng-template ngbNavContent>
                 <h4 class='title-tab-content'>
                    {{"Experience.MainTitle" | translate}} 
                <span class="company-tab-content"> - {{job.Tab}}</span>
                 </h4>
                 <h5 class="job-time">{{"Experience.MainDate" | translate}}</h5>

                <h6 class="mb-4 text-primary pb-2" style="font-weight: 700; border-bottom: 1px solid #eee;">
                 {{job.Title}}
                </h6>

                 <div class="job-description-wrapper">
                     <div *ngFor='let point of job.Description' class="d-flex mb-2">
                    <!-- <span class="text-primary mr-2">▹</span> -->
                     <p class="job-description mb-0" [innerHTML]="point | translate"></p>
                </div>
                </div>
            </ng-template>
          </li>
        </ul>
        
        <div [ngbNavOutlet]="nav" class="mt-2"></div>
      </div>
    </div>
  </div>
</section>
